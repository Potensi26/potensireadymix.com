<header id="header">
  <div id="head" class="parallax" data-parallax-speed="2" style="background-image:url('{{ .Site.BaseURL }}{{ .Site.Params.banner }}');">
    <h1 id="logo" class="text-center">
      <img class='img-{{ .Site.Params.avatarclass | default "circle"}}' src="{{ .Site.BaseURL }}{{ .Site.Params.avatar }}" alt="{{ .Title }}">
      <span class="title">{{ .Site.Params.name }}</span>
      <span class="tagline">{{ .Site.Params.description }}<br>
        <a href="mailto:{{ .Site.Params.email }}">Email: {{ .Site.Params.email }}</a>
        <a href="tel:{{ .Site.Params.telepon }}">WA: {{ .Site.Params.phone }}</a>
      </span>
   </h1>
   {{ if .IsHome }}
   <div class="hero-cta text-center">
     <a href="tel:{{ .Site.Params.telepon }}" class="btn-hero-call">
       <i class="fas fa-phone"></i> Hubungi Kami
     </a>
     <a href="https:{{ .Site.Params.whatsapp }}" class="btn-hero-whatsapp" target="_blank" rel="noopener">
       <i class="fab fa-whatsapp"></i> Chat Whatsapp
     </a>
   </div>
   {{ end }}
</div>
{{ partial "head/menu.html" . }}
</header>
